<div class="odds-comparison">
    <div data-odds-type="norm">
        <div class="odds-type">Market Implied Probabilities</div>
        <div class="odds-grid">
            <div style="font-weight: 800; font-size: 1.1rem;">{imp1_str}</div>
            <div style="color: #475569; font-weight: 500; font-size: 0.8rem; text-transform: uppercase;">Normalized Odds</div>
            <div style="font-weight: 800; text-align: right; font-size: 1.1rem;">{imp2_str}</div>
        </div>
    </div>
    <div data-odds-type="unnorm">
        <div class="odds-type">Raw Bookmaker Probability</div>
        <div class="odds-grid">
            <div style="font-weight: 800; font-size: 1.1rem;">{unnorm1_str}</div>
            <div style="color: #475569; font-weight: 500; font-size: 0.8rem; text-transform: uppercase;">Unnormalized</div>
            <div style="font-weight: 800; text-align: right; font-size: 1.1rem;">{unnorm2_str}</div>
        </div>
    </div>
    <div class="odds-grid" style="font-size: 0.8rem; color: var(--text-dim); margin-top: 0.3rem;">
            <div>{o1_str}</div>
            <div></div>
            <div style="text-align: right">{o2_str}</div>
    </div>
</div>
